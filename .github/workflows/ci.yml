name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # npm ci for the root scripts, the backend, and the frontend lockfiles.
      - name: Install dependencies
        run: npm run setup

      # Creates an isolated SQLite database (backend/prisma/test.db) for the
      # run; no external database or secrets are needed.
      - name: Backend tests
        run: npm --prefix backend test

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm run build
